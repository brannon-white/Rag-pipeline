name: PR

# Mirrors `make check` exactly (lint, typecheck, test-integration) -- see the
# Makefile's own comment: "Everything CI runs on a PR". Fully hermetic: no
# external network calls, no API keys required. Settings.anthropic_api_key /
# voyage_api_key both default to an empty SecretStr, so importing trialrag.*
# and running the unit + integration suite needs no secrets at all -- only
# the `network`-marked tests (real ClinicalTrials.gov / live Voyage calls)
# require them, and those are excluded here by `-m "not network"`.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same pinned image as docker-compose.yml -- halfvec/HNSW support
        # requires this specific pgvector version, not whatever "latest" is.
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: trialrag
          POSTGRES_PASSWORD: trialrag
          # tests/integration/conftest.py's TEST_DSN default points here
          # directly -- never `trialrag`, the dev/ingest database name.
          POSTGRES_DB: trialrag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trialrag -d trialrag_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv python install 3.13

      - run: uv sync --all-extras

      - name: lint
        run: uv run ruff check .

      - name: typecheck
        run: uv run mypy

      - name: test (unit + integration, no network)
        run: uv run pytest tests/ -m "not network"

  retrieval-gate:
    # Tier-1 retrieval eval (see the plan's eval-tier split): deterministic
    # and cheap enough to gate every PR, unlike the LLM-judge Tier-2
    # generation eval, which is nightly/Batch-API and doesn't exist until
    # M3/M5. Runs only once `check` passes, so a PR that's already broken on
    # lint/types/tests doesn't spend a Neon branch or Voyage API calls.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create ephemeral Neon branch
        # Branches (via copy-on-write) from the project's default branch,
        # which holds the real, permanently-ingested 30-study corpus --
        # migrated + seeded there once, out of band. Never the same branch
        # tests/integration/ uses: those run against a disposable local
        # Postgres service and fabricated embeddings, not this real corpus.
        uses: neondatabase/create-branch-action@v6
        id: neon-branch
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ci-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv python install 3.13

      - run: uv sync --all-extras

      - name: Retrieval regression gate (recall@10 vs baseline.json)
        env:
          TRIALRAG_DATABASE_URL: ${{ steps.neon-branch.outputs.db_url_pooled }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          # Safe default (config.py) assumes an unpaid, 3 req/min Voyage
          # tier; this account is paid, so raise it for this one job the same
          # way local ad-hoc eval runs already do -- see docs/EVALUATION.md
          # and SESSION_HANDOFF.md for why the hardcoded default itself stays
          # conservative.
          TRIALRAG_VOYAGE_RATE_LIMIT_RPM: "60"
        run: uv run python -m evals.check_regression

      - name: Delete ephemeral Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
